# nginx site for the Indian Gazettes website.
#
# Install as /etc/nginx/sites-available/egazette and symlink into
# sites-enabled/. TLS certificate paths below assume certbot; adjust to taste.

upstream egazette_app {
    server unix:/run/egazette/egazette.sock;
}

# Search is the expensive endpoint: a full-text query with highlighting is far
# more work than serving a stored gazette. Rate limit it so one client cannot
# saturate Postgres.
limit_req_zone $binary_remote_addr zone=egazette_search:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=egazette_ingest:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gazettes.example.org www.gazettes.example.org;

    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gazettes.example.org www.gazettes.example.org;

    ssl_certificate     /etc/letsencrypt/live/gazettes.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gazettes.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/egazette.access.log;
    error_log  /var/log/nginx/egazette.error.log;

    # Gazette PDFs are the large objects here; the ingest endpoint has to
    # accept one as a single upload. Keep in step with
    # EGAZETTE_MAX_UPLOAD_BYTES.
    client_max_body_size 256m;
    client_body_timeout  300s;
    client_body_buffer_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # --- static files -----------------------------------------------------
    # Produced by `manage.py collectstatic`; must match EGAZETTE_STATIC_ROOT.
    location /static/ {
        alias /srv/egazette/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        alias /srv/egazette/static/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /srv/egazette/static/robots.txt;
        access_log off;
    }

    # --- application ------------------------------------------------------

    location /search/ {
        limit_req zone=egazette_search burst=20 nodelay;
        include uwsgi_params;
        uwsgi_pass egazette_app;
        uwsgi_read_timeout 60s;
    }

    location /api/ingest/ {
        limit_req zone=egazette_ingest burst=60 nodelay;
        include uwsgi_params;
        uwsgi_pass egazette_app;
        # A large PDF upload is streamed straight through to the app rather
        # than spooled to disk first.
        uwsgi_request_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass egazette_app;
        uwsgi_read_timeout 120s;
    }

    # --- X-Accel-Redirect for gazette PDFs --------------------------------
    #
    # Only used when EGAZETTE_USE_X_ACCEL=true. Django authorises the request,
    # then names the file here and nginx sends it, so a multi-hundred-megabyte
    # PDF never occupies a Python worker.
    #
    # One internal location per entry in EGAZETTE_DATA_ROOTS, numbered from
    # zero in the same order. With
    #   EGAZETTE_DATA_ROOTS=/srv/egazette/data,/mnt/gzdl
    # keep /protected/0/ and add /protected/1/ pointing at /mnt/gzdl/.

    location /protected/0/ {
        internal;
        alias /srv/egazette/data/;
        add_header Content-Disposition $upstream_http_content_disposition;
    }

    # location /protected/1/ {
    #     internal;
    #     alias /mnt/gzdl/;
    #     add_header Content-Disposition $upstream_http_content_disposition;
    # }
}
