; uwsgi configuration for the Indian Gazettes website.
;
; Runs the Django app behind a unix socket that nginx proxies to. Environment
; comes from /etc/egazette-web.env via the systemd unit, so nothing secret
; lives in this file.
;
;   uwsgi --ini /home/sushant/egazette/website/deploy/uwsgi.ini

[uwsgi]
; Debian's /usr/bin/uwsgi is uwsgi-core, with no interpreter built in. The
; plugin must match the virtualenv's Python (3.12) rather than the distro's
; default python3 plugin, which is built against the system Python.
plugin          = python312

chdir           = /home/sushant/egazette/website
module          = egazette_site.wsgi:application

; The site shares the scraper's virtualenv, so datasrcs_info and the utils
; package import without any extra path setup.
home            = /home/sushant/.egazette312

master          = true
processes       = 4
; Threads help here because a request spends much of its time waiting on
; Postgres and on reading gazette HTML off disk.
threads         = 2
enable-threads  = true

socket          = /var/log/uwsgi/app/egazette/egazette.sock
chmod-socket    = 660
chown-socket    = egazette:www-data
vacuum          = true

; Uploading a several-hundred-megabyte PDF to /api/ingest/ can legitimately
; take a while; searching should never take anywhere near this long.
harakiri        = 300
harakiri-verbose = true
socket-timeout  = 300

; Gazette bodies are large, and so are the multipart uploads the ingest
; endpoint accepts.
buffer-size     = 32768
post-buffering  = 8192
limit-post      = 268435456

; Recycle workers periodically so a slow leak in a long-running process never
; accumulates; 2000 requests is frequent enough to be safe and rare enough
; not to cost anything.
max-requests            = 2000
max-requests-delta      = 200
reload-on-rss           = 1024
worker-reload-mercy     = 60

die-on-term     = true
need-app        = true
lazy-apps       = true
single-interpreter = true

; nginx serves static files directly, so no static-map is configured here.
; (An empty static-map is not "none" -- uwsgi still parses the value as
; mountpoint=docroot and refuses to start.)

log-date        = true
disable-logging = false
; Keep the log about real problems rather than one line per hit.
log-4xx         = true
log-5xx         = true
log-slow        = 5000
